<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ResumeLens - $title</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 40px;
        }

        .candidate-card {
            max-width: 850px;
            margin: auto;
            background-color: white;
            border: 1px solid #cccccc;
            border-radius: 10px;
            padding: 30px;
        }

        .header {
            border-bottom: 2px solid #333333;
            margin-bottom: 25px;
        }

        .header h1 {
            margin-bottom: 5px;
        }

        .header p {
            margin-top: 0;
        }

        .section {
            margin-bottom: 25px;
        }

        .section h2 {
            border-bottom: 1px solid #dddddd;
            padding-bottom: 5px;
        }

        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .skill {
            background-color: #eeeeee;
            border-radius: 5px;
            padding: 8px 12px;
        }

        .skill-group {
            margin-bottom: 15px;
        }

        .evaluation {
            background-color: #eeeeee;
            padding: 20px;
            border-radius: 8px;
        }

        .evaluation + .evaluation {
            margin-top: 15px;
        }

        .evaluation .skill {
            background-color: white;
        }

        .accepted {
            font-weight: bold;
        }

        .metadata {
            font-size: 0.9em;
        }

        @media (max-width: 600px) {
            body {
                padding: 16px;
            }

            .candidate-card {
                padding: 20px;
            }

            a {
                overflow-wrap: anywhere;
            }
        }
    </style>
</head>

<body>

<div class="candidate-card">

    <!-- Candidate identification -->
    <div class="header">
        <h1>$name</h1>
        <p>Candidate Profile generated by ResumeLens</p>
    </div>
$sections
</div>

</body>
</html>
