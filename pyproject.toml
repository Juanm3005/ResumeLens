[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "resumelens"
version = "0.1.0"
description = "Regex-based résumé information extraction for ResumeLens stage 1"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
stage2-preview = ["pyformlang>=1.0,<2"]

[project.scripts]
resumelens = "resumelens.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
