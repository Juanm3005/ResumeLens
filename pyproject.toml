[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "resumelens"
version = "0.2.0"
description = "Formal-language résumé screening: regex extraction, FST normalization, automata classification, textX DSL"
requires-python = ">=3.10"
dependencies = ["pyformlang>=1.0,<2"]

[project.scripts]
resumelens = "resumelens.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]